services:
  redis:
    image: redis:7-alpine
    container_name: pagely-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - pagely_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pagely_redis_data:
