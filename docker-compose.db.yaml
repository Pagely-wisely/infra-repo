services:
  postgres:
    image: postgres:16
    container_name: pagely-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pagely_postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro

  ai-postgres:
    image: pgvector/pgvector:pg16
    container_name: pagely-ai-postgres
    restart: always
    environment:
      POSTGRES_DB: pagely_ai
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_AI_PORT}:5432"
    volumes:
      - pagely_ai_postgres_data:/var/lib/postgresql/data
      - ./postgres/init/02-create-ai-db.sql:/docker-entrypoint-initdb.d/02-create-ai-db.sql:ro

volumes:
  pagely_postgres_data:
  pagely_ai_postgres_data: